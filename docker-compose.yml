services:
  postgres:
    image: postgres:16-alpine
    container_name: helpflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helpflow}
      POSTGRES_USER: ${POSTGRES_USER:-helpflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - helpflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  technician-dispatch-service:
    build:
      context: ./technician-dispatch-service
      dockerfile: Dockerfile
    container_name: helpflow-dispatch
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  support-ticket-service:
    build:
      context: ./support-ticket-service
      dockerfile: Dockerfile
    container_name: helpflow-tickets
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-helpflow}
      DB_USER: ${POSTGRES_USER:-helpflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-to-a-random-value-at-least-32-bytes-long}
      DISPATCH_URL: http://technician-dispatch-service:8081
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      technician-dispatch-service:
        condition: service_healthy

volumes:
  helpflow_postgres_data:
